name: Create EKS nodegroup
description: Create EKS nodegroup
inputs:
  cluster_name:
    description: ''
    required: true
  region:
    description: ''
    required: true
  owner:
    description: ''
    required: true
  version:
    description: ''
    required: false
    default: ''
  spot:
    description: ''
    required: false
    default: 'true'
  node_groups_override:
    description: 'Full "managedNodeGroups" YAML block to create node groups'
    required: false
    default: ''
  timeout:
    description: 'eksctl create nodegroup timeout (e.g. 15m). If empty, no --timeout flag is passed.'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Create nodegroup details
      if: ${{ inputs.node_groups_override == '' }}
      shell: bash
      run: |
        cat <<EOF > nodegroup-details.yaml
        managedNodeGroups:
        - name: ng-amd64
          instanceTypes:
           - t3a.medium
          desiredCapacity: 2
          spot: ${INPUTS_SPOT}
          privateNetworking: true
          volumeType: "gp3"
          volumeSize: 25
          taints:
           - key: "node.cilium.io/agent-not-ready"
             value: "true"
             effect: "NoExecute"
        - name: ng-arm64
          instanceTypes:
           - t4g.medium
          desiredCapacity: 1
          spot: ${INPUTS_SPOT}
          privateNetworking: true
          volumeType: "gp3"
          volumeSize: 25
          taints:
           - key: "node.cilium.io/agent-not-ready"
             value: "true"
             effect: "NoExecute"
        EOF
      env:
        INPUTS_SPOT: ${{ inputs.spot }}

    - name: Create nodegroup details from provided configuration
      if: ${{ inputs.node_groups_override != '' }}
      shell: bash
      run: |
        cat <<EOF > nodegroup-details.yaml
        ${INPUTS_NODE_GROUPS_OVERRIDE}
        EOF

        if [ "$(yq 'has("managedNodeGroups")' nodegroup-details.yaml)" != "true" ] \
          || [ "$(yq '.managedNodeGroups | length' nodegroup-details.yaml)" == "0" ]; then
          echo "node_groups_override must contain a non-empty 'managedNodeGroups' array"
          exit 1
        fi
      env:
        INPUTS_NODE_GROUPS_OVERRIDE: ${{ inputs.node_groups_override }}

    - name: Create EKS nodegroup
      shell: bash
      run: |
        cat <<EOF > eks-nodegroups.yaml
        apiVersion: eksctl.io/v1alpha5
        kind: ClusterConfig

        metadata:
          name: ${INPUTS_CLUSTER_NAME}
          region: ${INPUTS_REGION}
          version: "${INPUTS_VERSION}"
          tags:
           usage: "${{ github.repository_owner }}-${GITHUB_EVENT_REPOSITORY_NAME}"
           owner: "${INPUTS_OWNER}"

        EOF

        cat ./nodegroup-details.yaml >> ./eks-nodegroups.yaml

        TIMEOUT_ARG=""
        if [ -n "${INPUTS_TIMEOUT}" ]; then
          TIMEOUT_ARG="--timeout=${INPUTS_TIMEOUT}"
        fi

        eksctl create nodegroup -f ./eks-nodegroups.yaml ${TIMEOUT_ARG}
      env:
        INPUTS_CLUSTER_NAME: ${{ inputs.cluster_name }}
        INPUTS_REGION: ${{ inputs.region }}
        INPUTS_VERSION: ${{ inputs.version }}
        GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
        INPUTS_OWNER: ${{ inputs.owner }}
        INPUTS_TIMEOUT: ${{ inputs.timeout }}
